services:
  cassandra:
    image: cassandra:5.0
    container_name: tinderclone-cassandra
    ports:
      - '9042:9042'
    environment:
      CASSANDRA_CLUSTER_NAME: tinderclone
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 512M
    healthcheck:
      test: ['CMD-SHELL', "cqlsh -e 'describe cluster' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    volumes:
      - cassandra-data:/var/lib/cassandra

  redis:
    image: redis/redis-stack-server:7.4.0-v0
    container_name: tinderclone-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: tinderclone-kafka
    ports:
      - '9092:9092'
    environment:
      # KRaft mode — single-node broker+controller, no Zookeeper.
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_LISTENERS: 'INTERNAL://:9094,CONTROLLER://:9093,EXTERNAL://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9094,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  connect:
    image: debezium/connect:2.7.0.Final
    container_name: tinderclone-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - '8083:8083'
    environment:
      # Connect talks to Kafka over the internal docker-network listener.
      BOOTSTRAP_SERVERS: 'kafka:9094'
      GROUP_ID: 'tinderclone-connect'
      # Connect's own state lives in three Kafka topics (configs/offsets/status).
      CONFIG_STORAGE_TOPIC: 'tinderclone_connect_configs'
      OFFSET_STORAGE_TOPIC: 'tinderclone_connect_offsets'
      STATUS_STORAGE_TOPIC: 'tinderclone_connect_statuses'
      CONFIG_STORAGE_REPLICATION_FACTOR: '1'
      OFFSET_STORAGE_REPLICATION_FACTOR: '1'
      STATUS_STORAGE_REPLICATION_FACTOR: '1'
      KEY_CONVERTER: 'org.apache.kafka.connect.json.JsonConverter'
      VALUE_CONVERTER: 'org.apache.kafka.connect.json.JsonConverter'
      # Note: schemas.enable is set per-connector — the Debezium image's
      # entrypoint does not translate KEY/VALUE_CONVERTER_SCHEMAS_ENABLE into
      # the worker's nested converter properties.
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:8083/ >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  jaeger:
    # All-in-one ships collector + query + UI in one image — fine for local
    # dev. OTLP HTTP receiver on 4318 matches the app's default
    # OTEL_EXPORTER_OTLP_ENDPOINT, so traces flow without further config.
    image: jaegertracing/all-in-one:1.62.0
    container_name: tinderclone-jaeger
    ports:
      - '16686:16686'
      - '4317:4317'
      - '4318:4318'
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'

  postgres:
    image: postgis/postgis:16-3.4
    container_name: tinderclone-postgres
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: tinderclone
      POSTGRES_PASSWORD: tinderclone
      POSTGRES_DB: tinderclone
    # wal_level=logical exposes row-level change events for Debezium CDC.
    # max_wal_senders / max_replication_slots give us headroom for one slot.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tinderclone -d tinderclone']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  cassandra-data:
  postgres-data:
