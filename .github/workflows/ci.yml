# Two-stage deployment pipeline (Farley/Humble).
#   commit-stage    — fast feedback (≤ 5 min budget): lint, format,
#                     typecheck, unit tests, build the artifact once.
#   acceptance-stage — slower, production-like: bring up the same
#                     docker-compose services we use locally and run
#                     integration tests against them.
#
# CD (release/deploy) is intentionally absent — there is no deployment
# target yet. Adding it without a target would be cargo-culting.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref. Keeps queue cheap and means
# the latest commit is always the source of truth (matches Farley's
# "stop the line on red" — only the head commit matters).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.15.0'

jobs:
  commit-stage:
    name: commit stage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Build the release artifact exactly once. Even though no CD stage
      # consumes it yet, building it here proves the Dockerfile works on
      # every commit — Farley's "build once" rule.
      #
      # buildx with the docker-container driver is required for the
      # `type=gha` cache backend. The default docker driver doesn't support
      # cache export.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tinderclone:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  acceptance-stage:
    name: acceptance stage
    runs-on: ubuntu-latest
    needs: commit-stage
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reuse the repo's compose file — same services, same health checks,
      # same versions developers run locally. One source of truth.
      - name: Start service dependencies
        run: docker compose up -d --wait

      - name: Integration tests
        run: pnpm test:integration

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
